<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>周末理科学习台 · 20分钟</title>
<style>
  :root{
    --math:#4f7cff; --math-bg:#eef3ff;
    --phys:#ff8a3d; --phys-bg:#fff4ea;
    --next:#22b573; --next-bg:#eafaf2;
    --warn:#e05252; --warn-bg:#fdeeee;
    --ink:#2b2f3a; --sub:#6b7280; --line:#e5e7eb;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; color:var(--ink); background:#faf9f6; line-height:1.7;}
  .wrap{max-width:860px; margin:0 auto; padding:0 16px 60px;}
  .fig svg{width:100%; height:auto; max-width:360px;}

  header{background:linear-gradient(135deg,#5b8cff 0%,#8a6bff 55%,#c06bff 100%); color:#fff; padding:34px 16px 30px; text-align:center;}
  header h1{font-size:26px; letter-spacing:2px;}
  header .sub{margin-top:6px; font-size:14px; opacity:.92;}
  .timer-box{margin:20px auto 0; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.35); border-radius:16px; padding:14px 26px; display:inline-block; backdrop-filter:blur(4px);}
  #timer{font-size:44px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:3px; line-height:1.2;}
  .timer-btns{margin-top:8px; display:flex; gap:10px; justify-content:center;}
  .timer-btns button{border:none; border-radius:20px; padding:6px 22px; font-size:14px; cursor:pointer; background:#fff; color:#5b3df0; font-weight:600;}
  .timer-btns button.ghost{background:transparent; color:#fff; border:1px solid rgba(255,255,255,.6);}
  .bar{height:6px; background:rgba(255,255,255,.25); border-radius:3px; margin-top:12px; max-width:420px; margin-left:auto; margin-right:auto; overflow:hidden;}
  .bar>div{height:100%; width:0%; background:#ffd76e; border-radius:3px; transition:width 1s linear;}
  .steps{display:flex; justify-content:center; gap:8px; margin-top:18px; flex-wrap:wrap;}
  .step{background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3); border-radius:20px; padding:5px 14px; font-size:13px; transition:.3s;}
  .step.on{background:#ffd76e; color:#4a3800; font-weight:700; border-color:#ffd76e;}

  section{margin-top:34px;}
  .sec-head{display:flex; align-items:baseline; gap:10px; margin-bottom:6px; flex-wrap:wrap;}
  .sec-head h2{font-size:20px;}
  .sec-head .badge{background:var(--ink); color:#fff; border-radius:12px; font-size:12px; padding:2px 10px; white-space:nowrap;}
  .sec-desc{color:var(--sub); font-size:13.5px; margin-bottom:14px;}

  .cards{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media(max-width:640px){.cards{grid-template-columns:1fr;}}
  .kcard{border-radius:14px; padding:14px 16px; border:1px solid var(--line); background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .kcard.math{border-top:3px solid var(--math);}
  .kcard.phys{border-top:3px solid var(--phys);}
  .kcard h3{font-size:15.5px; margin-bottom:6px; display:flex; align-items:center; gap:6px;}
  .kcard.math h3 .tag{color:var(--math);}
  .kcard.phys h3 .tag{color:var(--phys);}
  .kcard ul{padding-left:18px; font-size:13.5px;}
  .kcard ul li{margin:3px 0;}
  .pit{margin-top:8px; background:var(--warn-bg); border-left:3px solid var(--warn); border-radius:6px; padding:6px 10px; font-size:12.8px; color:#8a3232;}
  .pit b{color:var(--warn);}

  .q{background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .q-meta{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; font-size:12px;}
  .pill{border-radius:10px; padding:2px 10px; font-weight:600;}
  .pill.subj-math{background:var(--math-bg); color:var(--math);}
  .pill.subj-phys{background:var(--phys-bg); color:#d96a1e;}
  .pill.lv1{background:#eafaf2; color:#1d8f5c;}
  .pill.lv2{background:#fff8e6; color:#b8860b;}
  .pill.lv3{background:#fdeeee; color:var(--warn);}
  .q-from{font-size:12px; color:var(--sub); margin-bottom:8px;}
  .q-stem{font-size:15px;}
  .q-stem .fig{text-align:center; margin:10px 0;}
  details.sol{margin-top:12px; border:1px dashed #c8cdff; border-radius:10px; background:#f8f9ff;}
  details.sol summary{cursor:pointer; padding:8px 14px; font-size:14px; font-weight:600; color:#4f46e5; list-style:none; user-select:none;}
  details.sol summary::-webkit-details-marker{display:none;}
  details.sol summary::before{content:"👁 ";}
  details.sol[open] summary::before{content:"✅ ";}
  details.sol .sol-body{padding:4px 16px 12px; font-size:14px; border-top:1px dashed #dfe3ff;}
  .sol-body p{margin:6px 0;}
  .key-point{margin-top:8px; background:#f0fbf5; border-left:3px solid var(--next); border-radius:6px; padding:6px 10px; font-size:13px; color:#1d7a4f;}
  .parent-tip{margin-top:8px; background:#f5f0ff; border-left:3px solid #8a6bff; border-radius:6px; padding:6px 10px; font-size:13px; color:#5b46b8;}
  .breakthrough{margin:8px 0 2px; background:#eef6ff; border:1px solid #cfe4ff; border-radius:8px; padding:8px 12px; font-size:13.5px;}
  .breakthrough div{margin:3px 0;}
  .breakthrough b{color:#2b6cb0;}
  .self-rate{margin-top:12px; display:flex; align-items:center; gap:10px; font-size:13.5px; flex-wrap:wrap;}
  .self-rate button{border:none; border-radius:18px; padding:6px 18px; cursor:pointer; font-size:13.5px; font-weight:600;}
  .btn-got{background:#e2f7ec; color:#1d8f5c; border:1px solid #bfe9d4 !important;}
  .btn-not{background:#fdeeee; color:var(--warn); border:1px solid #f5cfcf !important;}
  .self-rate button.chosen{box-shadow:0 0 0 2px rgba(0,0,0,.12) inset; opacity:.75;}

  .feyn-box{background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .feyn-box ol{padding-left:20px; font-size:14px;}
  .feyn-box ol li{margin:5px 0;}
  .feyn-ask{margin-top:10px; background:#fff7e8; border-left:3px solid #e8a930; border-radius:6px; padding:8px 12px; font-size:13.5px; color:#8a6414;}

  .precheck{background:#fff; border:1px dashed #b8c4ff; border-radius:14px; padding:14px 18px; font-size:14px; color:var(--sub);}
  .precheck .pq{margin-top:10px; background:#f6f7fb; border-radius:10px; padding:10px 14px; color:var(--ink);}
  .precheck .pq details summary{cursor:pointer; font-weight:600; color:#4f46e5; list-style:none;}
  .precheck .pq details summary::-webkit-details-marker{display:none;}

  #retrain-card{display:none;}
  .rq{border:1px solid #999; border-radius:10px; padding:14px 16px; margin-bottom:16px; break-inside:avoid;}
  .rq h4{font-size:15px; margin-bottom:6px;}
  .rq .stem{font-size:14.5px;}
  .rq .workspace{margin-top:10px; border:1.5px dashed #bbb; border-radius:8px; height:170px;}

  .ncard{border-radius:14px; padding:16px 18px; border:1px solid var(--line); background:#fff; margin-bottom:12px; border-top:3px solid var(--next); box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .ncard h3{font-size:16px; margin-bottom:8px;}
  .ncard ul{padding-left:18px; font-size:14px;}
  .ncard ul li{margin:4px 0;}
  .think{margin-top:10px; background:var(--next-bg); border-left:3px solid var(--next); border-radius:6px; padding:8px 12px; font-size:13.5px; color:#186b48;}

  .parent{background:#fffbe8; border:1px solid #f2e2a0; border-radius:14px; padding:16px 18px; font-size:14px;}
  .parent h3{font-size:16px; margin-bottom:8px;}
  .parent ul{padding-left:18px;}
  .parent li{margin:4px 0;}

  .scoreboard{position:sticky; bottom:0; margin-top:26px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 18px; display:flex; align-items:center; justify-content:space-between; gap:10px; box-shadow:0 -2px 10px rgba(0,0,0,.06); flex-wrap:wrap;}
  .scoreboard .txt{font-size:14px;}
  .actions{display:flex; gap:10px;}
  .actions button{border:none; border-radius:20px; padding:7px 20px; cursor:pointer; font-size:13.5px; font-weight:600;}
  #btn-print{background:var(--ink); color:#fff;}
  #btn-clear{background:#f1f2f6; color:var(--sub);}

  /* ---------- 分享弹层 ---------- */
  .share-mask{display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; align-items:center; justify-content:center;}
  .share-mask.show{display:flex;}
  .share-box{background:#fff; border-radius:16px; padding:20px 24px; text-align:center; max-width:300px; width:88%;}
  .share-box img{width:200px; height:200px; margin:8px auto; display:block;}
  .share-box .url{font-size:12px; color:var(--sub); word-break:break-all; margin:6px 0;}
  .share-box button{margin-top:10px; border:none; border-radius:20px; padding:8px 26px; background:#4f46e5; color:#fff; font-size:14px; cursor:pointer;}
  .share-box .close{margin-top:8px; font-size:12px; color:var(--sub); cursor:pointer;}
  .done-msg{text-align:center; color:var(--sub); font-size:13px; margin-top:18px;}

  svg text{font-family:"Microsoft YaHei",sans-serif;}

  /* ---------- 响应式：pad 横竖 / 宽屏 / 带鱼屏 ---------- */
  @media(min-width:1024px){ .wrap{max-width:1000px;} }
  @media(min-width:1440px){
    .wrap{max-width:1200px;}
    .cards{grid-template-columns:repeat(3,1fr);}
  }
  @media(min-width:2000px){
    .wrap{max-width:1560px; padding-left:28px; padding-right:28px;}
    #sec2{display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start;}
    #sec2>.sec-head, #sec2>.sec-desc{grid-column:1/-1;}
    #sec2>.q{margin-bottom:0;}
  }
  @media print{
    header .timer-btns, .self-rate, .actions, .bar, .steps{display:none !important;}
    details.sol{border:1px solid #bbb;}
    details.sol .sol-body{display:block !important;}
    summary{display:none;}
    .q,.kcard,.ncard{box-shadow:none; break-inside:avoid;}
    body{background:#fff;}
    body.print-retrain header{display:none !important;}
    body.print-retrain .wrap>*{display:none !important;}
    body.print-retrain .wrap>#retrain-card{display:block !important;}
  }
</style>
</head>
<body>

<header>
  <h1>🔬 周末理科学习台</h1>
  <div class="sub" id="hero-sub"></div>
  <div style="margin-top:8px; font-size:13px;"><a href="map.html" style="color:#fff; text-decoration:underline;">🗺 题型地图（考点×题型×七步流程）</a> · <a href="questions.html" style="color:#fff; text-decoration:underline;">📚 全书题库（682题可搜）</a></div>
  <div class="timer-box">
    <div id="timer">20:00</div>
    <div class="timer-btns">
      <button id="btn-start">▶ 开始</button>
      <button id="btn-reset" class="ghost">↺ 重置</button>
    </div>
    <div class="bar"><div id="bar-fill"></div></div>
  </div>
  <div class="steps">
    <div class="step" id="step1">① 检测+扫描 · 5分钟</div>
    <div class="step" id="step2">② 举一反三 · 9分钟</div>
    <div class="step" id="step3">③ 费曼讲题 · 2分钟</div>
    <div class="step" id="step4">④ 下周抢先看 · 4分钟</div>
  </div>
</header>

<div class="wrap">
  <div id="content"></div>

  <div id="retrain-card"></div>

  <div class="scoreboard">
    <div class="txt" id="score"></div>
    <div class="actions">
      <button id="btn-share" style="display:none;background:#4f46e5;color:#fff;">📤 分享</button>
      <button id="btn-retrain">🖨 周中重练卡</button>
      <button id="btn-print">🖨 打印本页</button>
      <button id="btn-clear">清空重练</button>
    </div>
  </div>

  <div class="share-mask" id="share-mask">
    <div class="share-box">
      <div style="font-weight:700;">📤 分享给微信 / QQ</div>
      <div style="font-size:13px; color:#6b7280;">对方扫码，或点下面复制链接去发送</div>
      <img id="qr-fallback" style="display:none;" alt="二维码">
      <div id="qr-img" style="width:200px;height:200px;margin:8px auto;"></div>
      <div class="url" id="share-url"></div>
      <button id="btn-copy">复制链接</button>
      <div class="close" id="share-close">关闭</div>
    </div>
  </div>
</div>

<script src="data-current-20260921.js"></script>
<script src="qrcode.min.js"></script>
<script>
(function(){
  var D = window.STUDY_WEEK;

  /* ---------- 渲染：内容全部来自 data-current.js ---------- */
  function figHtml(q){ return q.fig ? '<div class="fig">'+q.fig+'</div>' : ''; }

  var h = '';
  document.getElementById('hero-sub').textContent =
    D.dateLabel + ' ｜ ' + D.scope + ' ｜ 建议每周六上午使用';

  /* 开场：上周预习检测 */
  h += '<section id="sec0"><div class="sec-head"><h2>⚡ 开场 · 上周预习检测</h2><span class="badge">2 分钟</span></div>';
  if (D.precheck && D.precheck.items) {
    h += '<div class="precheck">';
    D.precheck.items.forEach(function(it, i){
      h += '<div class="pq"><b>检测 '+(i+1)+'：</b>'+it.q+
           '<details><summary>想好了，点开对答案</summary><p style="margin-top:6px;"><b>'+it.a+'</b></p></details></div>';
    });
    h += '</div>';
  } else {
    h += '<div class="precheck">'+D.precheckNote+'</div>';
  }
  h += '</section>';

  /* 第一步：考点扫描 */
  h += '<section id="sec1"><div class="sec-head"><h2>📋 第一步 · 本周重难点扫描</h2><span class="badge">约 3 分钟</span></div>'+
       '<p class="sec-desc">先快速过一遍这周学的考点，红色「⚠ 踩过的坑」都是你本周作业和试卷里真实出错的地方——多看一眼，下周就不踩。</p><div class="cards">';
  D.cards.forEach(function(c){
    h += '<div class="kcard '+c.subject+'"><h3><span class="tag">'+(c.subject==='math'?'数学':'物理')+'</span>'+c.title+'</h3><ul>';
    c.points.forEach(function(p){ h += '<li>'+p+'</li>'; });
    h += '</ul><div class="pit"><b>⚠ 踩过的坑：</b>'+c.pit+'</div></div>';
  });
  h += '</div></section>';

  /* 第二步：错题举一反三 */
  h += '<section id="sec2"><div class="sec-head"><h2>🎯 第二步 · 错题举一反三</h2><span class="badge">约 9 分钟</span></div>'+
       '<p class="sec-desc">变式题全部来自你<b>本周做错的真题</b>，换了数字、换了情境、或者反过来问。<b>先在草稿纸上写过程，再点开解析</b>，最后诚实地点「会了」或「还不会」。</p>';
  D.questions.forEach(function(q, i){
    h += '<div class="q" data-q="'+q.id+'">'+
      '<div class="q-meta"><span class="pill subj-'+q.subject+'">'+(q.subject==='math'?'数学':'物理')+'</span><span class="pill lv'+q.lv+'">'+q.level+'</span></div>'+
      '<div class="q-from">变式 '+(i+1)+' · '+q.fromNote+'</div>'+
      '<div class="q-stem">'+q.stem+figHtml(q)+'</div>'+
      '<details class="sol"><summary>想好了，看解析</summary><div class="sol-body">';
    if (q.trigger) {
      h += '<div class="breakthrough">'+
        '<div><b>⚡ 触发词：</b>'+q.trigger+'</div>'+
        '<div><b>🚪 入口：</b>'+q.entry+'</div>'+
        '<div><b>📍 知识点：</b>'+q.kp+'</div>'+
        '<div><b>🔗 常联姻：</b>'+q.combo+'</div>'+
        '</div>';
    }
    q.solution.forEach(function(p){ h += '<p>'+p+'</p>'; });
    if (q.keyPoint) h += '<div class="key-point">'+q.keyPoint+'</div>';
    if (q.parentTip) h += '<div class="parent-tip">👨‍👩‍👧 <b>家长提示（别提答案）：</b>'+q.parentTip+'</div>';
    h += '</div></details>'+
      '<div class="self-rate"><span>这题我：</span><button class="btn-got" data-r="got">✓ 会了</button><button class="btn-not" data-r="not">✗ 还不会</button></div>'+
      '</div>';
  });
  h += '</section>';

  /* 第三步：费曼 */
  h += '<div style="margin:10px 0 14px; background:#eef2ff; border-radius:10px; padding:10px 14px; font-size:13.5px;"><b>📖 做完变式不过瘾？</b> 去 <a href="questions.html" style="color:#2563eb;">全书题库</a> 搜本周考点（如「轴对称」「翻折」），每题都配书页原图，先自己写再看图核对。</div>'<section id="sec-feyn"><div class="sec-head"><h2>🎤 第三步 · 费曼时间：讲给爸妈听</h2><span class="badge">约 2 分钟</span></div>'+
    '<div class="feyn-box">'+
    '<p style="font-size:14px;">从刚才<b>点了"✓ 会了"的题</b>里挑一道你最想讲的（如果都还不会，就挑一张第一步里的考点卡），合上网页，讲给爸爸或妈妈听。</p>'+
    '<p style="font-size:14px; margin-top:6px;"><b>按这三步讲：</b></p><ol>'+
    '<li>这道题<b>已知什么、求什么</b>？</li>'+
    '<li><b>关键一步</b>是什么？为什么想到这么做？</li>'+
    '<li>如果<b>换个数字、换个说法</b>，这个方法还成立吗？</li></ol>'+
    '<div class="feyn-ask">👂 <b>家长当好"好奇的听众"，三连问：</b>"为什么这样做？""能不能换个说法再讲一遍？""数字变了还对吗？"——多问，别急着纠正。</div>'+
    '<div class="self-rate" style="margin-top:14px;"><span>讲得怎么样：</span>'+
    '<button class="btn-got" data-f="clear">🎤 讲清楚了</button>'+
    '<button class="btn-not" data-f="stuck">😖 有点卡壳</button>'+
    '<button class="btn-not" data-f="none">🤐 没讲出来</button></div></div></section>';

  /* 第四步：下周抢先看 */
  h += '<section id="sec3"><div class="sec-head"><h2>🚀 第四步 · 下周重难点抢先看</h2><span class="badge">约 4 分钟</span></div>'+
       '<p class="sec-desc">不用做题，只要混个"眼熟"：知道下周要学什么、带着一个问题去听课，课堂上吸收会快一倍。</p>';
  D.previews.forEach(function(n){
    h += '<div class="ncard"><h3>'+n.title+'</h3><ul>';
    n.points.forEach(function(p){ h += '<li>'+p+'</li>'; });
    h += '</ul><div class="think">'+n.think+'</div></div>';
  });
  h += '</section>';

  /* 家长小结 */
  h += '<section id="sec4"><div class="sec-head"><h2>👨‍👩‍👧 给爸妈的小结</h2></div><div class="parent"><h3>本周理科情况</h3><ul>';
  D.parentLines.forEach(function(l){ h += '<li>'+l+'</li>'; });
  h += '<li>「打印本页」可打印完整内容（含解析）留档；「周中重练卡」只印题不印答案。</li></ul></div>'+
       '<p class="done-msg">坚持每周 20 分钟，考点滚动着复习——期末你会感谢现在的自己 💪</p></section>';

  document.getElementById('content').innerHTML = h;

  /* ---------- 20 分钟倒计时 ---------- */
  var TOTAL = 20*60, left = TOTAL, tick = null;
  var elTimer = document.getElementById('timer'),
      elBar = document.getElementById('bar-fill'),
      btnStart = document.getElementById('btn-start'),
      btnReset = document.getElementById('btn-reset');
  var steps = [document.getElementById('step1'), document.getElementById('step2'), document.getElementById('step3'), document.getElementById('step4')];
  function fmt(s){ s=Math.max(0,s); var m=Math.floor(s/60), r=s%60; return (m<10?'0':'')+m+':'+(r<10?'0':'')+r; }
  function render(){
    elTimer.textContent = fmt(left);
    elBar.style.width = ((TOTAL-left)/TOTAL*100)+'%';
    var el = TOTAL-left;
    var idx = el < 5*60 ? 0 : (el < 14*60 ? 1 : (el < 16*60 ? 2 : 3));
    if(left<=0) idx = 3;
    steps.forEach(function(s,i){ s.classList.toggle('on', i===idx); });
  }
  function stop(){ if(tick){clearInterval(tick); tick=null;} btnStart.textContent='▶ 继续'; }
  btnStart.addEventListener('click', function(){
    if(tick){ stop(); return; }
    if(left<=0) left=TOTAL;
    btnStart.textContent='⏸ 暂停';
    tick=setInterval(function(){ left--; render(); if(left<=0){ stop(); alert('⏰ 20 分钟到！没做完也没关系，收个尾，剩下的留给下周。'); } },1000);
  });
  btnReset.addEventListener('click', function(){ stop(); left=TOTAL; render(); btnStart.textContent='▶ 开始'; });
  render();

  /* ---------- 自评 + 战绩（localStorage 按 weekId 隔离） ---------- */
  var KEY = 'weekend-study-' + D.weekId;
  var store = {};
  try{ store = JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ store={}; }
  var scoreEl = document.getElementById('score');
  var TOTAL_Q = D.questions.length;
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
  function updateScore(){
    var n=0, got=0, nots=0;
    document.querySelectorAll('.q').forEach(function(q){
      var id=q.getAttribute('data-q');
      if(store[id]){ n++; if(store[id]==='got') got++; else nots++; }
    });
    var extra = nots? ('，待攻克：'+nots+' 道') : (n===TOTAL_Q && TOTAL_Q?'，全部拿下 🎉':'');
    var feyn = store.feynman==='clear' ? ' ｜ 费曼：🎤 讲清楚了' :
               store.feynman==='stuck' ? ' ｜ 费曼：有点卡壳' :
               store.feynman==='none'  ? ' ｜ 费曼：没讲出来' : '';
    scoreEl.textContent = '本周举一反三：已评 '+n+' / '+TOTAL_Q+' · 会了 '+got+' 道'+extra+feyn;
  }
  document.querySelectorAll('.q').forEach(function(q){
    var id=q.getAttribute('data-q');
    var btns=q.querySelectorAll('.self-rate button');
    function paint(){
      btns.forEach(function(b){ b.classList.toggle('chosen', b.getAttribute('data-r')===store[id]); });
    }
    btns.forEach(function(b){
      b.addEventListener('click', function(){
        store[id]=b.getAttribute('data-r'); save(); paint(); updateScore();
      });
    });
    paint();
  });

  var feynBtns = document.querySelectorAll('[data-f]');
  function paintFeyn(){
    feynBtns.forEach(function(b){ b.classList.toggle('chosen', b.getAttribute('data-f')===store.feynman); });
  }
  feynBtns.forEach(function(b){
    b.addEventListener('click', function(){
      store.feynman = b.getAttribute('data-f'); save(); paintFeyn(); updateScore();
    });
  });
  paintFeyn();
  updateScore();

  /* ---------- 周中重练卡 ---------- */
  document.getElementById('btn-retrain').addEventListener('click', function(){
    var nots=[];
    document.querySelectorAll('.q').forEach(function(q){
      if(store[q.getAttribute('data-q')]==='not') nots.push(q);
    });
    if(!nots.length){ alert('本周没有「还不会」的题，全部拿下 🎉 不需要重练卡。'); return; }
    var box=document.getElementById('retrain-card');
    box.innerHTML='<h2 style="margin-bottom:4px;">📝 周中重练卡 · '+D.retrainDate+'</h2><p style="font-size:13px;color:#666;margin-bottom:14px;">本周"还不会"的 '+nots.length+' 道变式题 · 只重做、不看答案 · 做完拍照发给 AI 批改</p>';
    nots.forEach(function(q,i){
      var d=document.createElement('div'); d.className='rq';
      var subj=q.querySelector('.q-meta .pill').textContent;
      d.innerHTML='<h4>重练 '+(i+1)+'【'+subj+'】</h4>';
      var stem=q.querySelector('.q-stem').cloneNode(true);
      stem.className='stem'; d.appendChild(stem);
      var w=document.createElement('div'); w.className='workspace'; d.appendChild(w);
      box.appendChild(d);
    });
    document.body.classList.add('print-retrain');
    setTimeout(function(){
      window.print();
      document.body.classList.remove('print-retrain');
    }, 60);
  });

  document.getElementById('btn-clear').addEventListener('click', function(){
    if(!confirm('清空本周末的自评记录，重新开始？')) return;
    store={}; save();
    document.querySelectorAll('.q .self-rate button').forEach(function(b){ b.classList.remove('chosen'); });
    document.querySelectorAll('.q details.sol').forEach(function(d){ d.open=false; });
    paintFeyn(); updateScore();
  });

  /* ---------- 打印 ---------- */
  document.getElementById('btn-print').addEventListener('click', function(){
    document.querySelectorAll('details.sol').forEach(function(d){ d.open=true; });
    setTimeout(function(){ window.print(); }, 60);
  });

  /* ---------- 分享（仅在线页面显示；手机调系统分享面板，电脑显示二维码+复制） ---------- */
  var btnShare = document.getElementById('btn-share');
  if (location.protocol === 'http:' || location.protocol === 'https:') {
    btnShare.style.display = '';
    btnShare.addEventListener('click', function(){
      if (navigator.share) {
        navigator.share({ title: document.title, text: '周末理科学习台', url: location.href }).catch(function(){});
      } else {
        var qrBox = document.getElementById('qr-img');
        qrBox.innerHTML = '';
        new QRCode(qrBox, { text: location.href, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
        document.getElementById('share-url').textContent = location.href;
        document.getElementById('share-mask').classList.add('show');
      }
    });
    document.getElementById('share-close').addEventListener('click', function(){
      document.getElementById('share-mask').classList.remove('show');
    });
    document.getElementById('btn-copy').addEventListener('click', function(){
      var url = location.href;
      if (navigator.clipboard) { navigator.clipboard.writeText(url); }
      else { var ta=document.createElement('textarea'); ta.value=url; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
      this.textContent = '已复制 ✓'; var b=this; setTimeout(function(){ b.textContent='复制链接'; }, 1500);
    });
  }
})();
</script>
</body>
</html>
